<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRA</title><style>body{font-family:system-ui;margin:0;background:#101521;color:#e9edf8}header{padding:26px 7%;background:#172034}main{max-width:1100px;margin:25px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,form{background:#192235;padding:18px;border-radius:12px}button{background:#52e0b1;border:0;padding:9px 13px;border-radius:8px;font-weight:700}input{margin:6px 0;padding:9px;width:95%}.danger{background:#fa7785}small{color:#acb9d2}</style></head><body><header><h1>ASTRA <small>Local Operations Platform</small></h1><p>Property Studio · Commerce & Creators · Trading Lab · System Control</p></header><main><div id="status" class="grid"></div><h2>Property Studio</h2><form id="property"><input name="listing_url" placeholder="Optional public listing URL"><input name="files" type="file" accept="image/*" multiple required><button>Upload owner-authorized images</button></form><h2>Safety</h2><button class="danger" onclick="stop()">Emergency stop</button><pre id="log"></pre></main><script>const log=x=>document.querySelector('#log').textContent=JSON.stringify(x,null,2);async function refresh(){let x=await fetch('/api/system').then(r=>r.json());document.querySelector('#status').innerHTML=Object.entries(x.counts).map(([k,v])=>`<div class=card><b>${k}</b><h2>${v}</h2></div>`).join('')+`<div class=card><b>Trading mode</b><h2>${x.settings.trading_mode}</h2><small>External writes: ${x.external_writes_enabled}</small></div>`}document.querySelector('#property').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/properties',{method:'POST',body:new FormData(e.target)});log(await r.json());refresh()};async function stop(){log(await fetch('/api/system/emergency-stop',{method:'POST'}).then(r=>r.json()));refresh()}refresh()</script></body></html>
