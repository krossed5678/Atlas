<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRA</title>
<style>
:root{--bg:#070b15;--panel:#10192c;--line:#263a5e;--ink:#edf3ff;--muted:#9eb0d1;--mint:#72e2bc;--gold:#e8c77a;--red:#ff7889}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#172748 0,var(--bg) 42%);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,sans-serif}header{padding:26px max(24px,5vw);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:26px;letter-spacing:.12em}h2{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}h3{font-size:14px;margin:0 0 9px}.sub,.muted{color:var(--muted)}main{max-width:1440px;margin:auto;padding:22px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}.metric,.panel{background:linear-gradient(145deg,#14203a,#0c1426);border:1px solid var(--line);border-radius:14px}.metric{padding:13px}.metric b{font-size:22px;display:block;margin-top:5px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel{padding:17px;margin-bottom:16px}.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wide{grid-column:1/-1}input,textarea,select{width:100%;margin:5px 0 10px;padding:10px;background:#070e1d;color:var(--ink);border:1px solid #31476f;border-radius:8px}textarea{min-height:74px;resize:vertical}button{background:var(--mint);color:#062017;border:0;border-radius:8px;padding:9px 11px;font-weight:750;cursor:pointer;margin:3px 4px 3px 0}.secondary{background:#233a61;color:var(--ink)}.danger{background:var(--red);color:#2d0710}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid #20304e;vertical-align:top}th{color:var(--muted);font-weight:600}.scroll{max-height:255px;overflow:auto}pre{max-height:190px;overflow:auto;white-space:pre-wrap;background:#070e1d;padding:12px;border-radius:8px}.pill{padding:3px 7px;border-radius:999px;background:#1c3151;color:#bae9da;font-size:11px}@media(max-width:900px){.layout{grid-template-columns:1fr}.triple{grid-template-columns:1fr}header{display:block}header p{margin-top:8px}}
</style></head><body>
<header><div><h1>ASTRA</h1><p class="sub">Property Films · TikTok Commerce · Paper Trading · Outreach</p></div><div><span class="pill">LOCAL-FIRST</span> <button class="danger" onclick="stopSystem()">Emergency stop</button></div></header>
<main><div id="metrics" class="metrics"></div><div class="layout">
<section><div class="panel"><h2>Property Films</h2><form id="property-folder"><input name="folder_path" placeholder="Local photo folder — C:\\Photos\\Property" required><input name="listing_url" placeholder="Optional property URL metadata"><button>Import photo set</button></form><div id="properties" class="scroll"></div></div>
<div class="panel"><h2>Market Research</h2><form id="bars"><input name="folder_path" placeholder="Price-bar folder — SYMBOL__etf.csv" required><button>Import market data</button><button type="button" class="secondary" onclick="evolve()">Evolve imported universe</button></form><div id="strategies" class="scroll"></div></div>
<div class="panel"><h2>Paper Bot Desk</h2><form id="bot"><input name="strategy_id" placeholder="Held-out strategy ID" required><select name="role"><option value="trader">Trader bot</option><option value="market_reader">Market reader</option></select><button>Select paper bot</button></form><div class="triple"><div><h3>Bots</h3><div id="bots" class="scroll"></div></div><div><h3>Positions</h3><div id="positions" class="scroll"></div></div><div><h3>Capital</h3><div id="capital" class="muted"></div></div></div></div></section>
<section><div class="panel"><h2>TikTok Dropship Desk</h2><p id="tiktok-status" class="muted"></p><form id="product"><input name="title" placeholder="Product title" required><div class="triple"><input name="supplier_name" placeholder="Supplier" required><input name="supplier_sku" placeholder="Supplier SKU" required><input name="cost_cents" type="number" placeholder="Cost cents" required></div><input name="sale_cents" type="number" placeholder="Sale cents" required><button>Create product draft</button></form><h3>Draft products</h3><div id="products" class="scroll"></div><h3>Orders</h3><div id="orders" class="scroll"></div></div>
<div class="panel"><h2>Reviewed Outreach</h2><form id="email"><input name="lead_id" placeholder="Lead ID" required><input name="subject" placeholder="Subject" required><textarea name="body" placeholder="Personalized draft body" required></textarea><button>Create review draft</button></form><div id="emails" class="scroll"></div></div>
<div class="panel"><h2>System Activity</h2><button class="secondary" onclick="refresh()">Refresh</button><button class="secondary" onclick="resumeSystem()">Resume paper services</button><pre id="log">Ready.</pre></div></section></div></main>
<script>
const log=x=>document.querySelector('#log').textContent=JSON.stringify(x,null,2);const j=async r=>{let x=await r.json();if(!r.ok)throw x;return x};const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));function grid(rows,cols){return rows?.length?`<table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])}</td>`).join('')}</tr>`).join('')}</table>`:'<span class="muted">No records yet.</span>'}async function api(url,opt){try{return await fetch(url,opt).then(j)}catch(e){log(e);throw e}}async function refresh(){let [sys,props,strategies,bots,positions,capital,products,orders,emails,tiktok]=await Promise.all(['/api/system','/api/properties','/api/trading/strategies','/api/trading/bots','/api/trading/positions','/api/ledger/capital','/api/commerce/tiktok/products','/api/commerce/orders','/api/outreach/drafts','/api/commerce/tiktok/readiness'].map(x=>api(x)));document.querySelector('#metrics').innerHTML=Object.entries(sys.counts).map(([k,v])=>`<div class="metric"><span class="muted">${esc(k.replaceAll('_',' '))}</span><b>${v}</b></div>`).join('');document.querySelector('#properties').innerHTML=props.length?props.map(p=>`<div class="panel"><b>${esc(p.id)}</b><br><span class="muted">${p.source_count} photos · ${esc(p.status)}</span><br><button onclick="renderFilm('${p.id}','landscape')">Luxury landscape</button><button class="secondary" onclick="renderFilm('${p.id}','portrait')">TikTok vertical</button></div>`).join(''):'<span class="muted">Import a photo set to begin.</span>';document.querySelector('#strategies').innerHTML=grid(strategies.strategies,['id','symbol','asset_class','status']);document.querySelector('#bots').innerHTML=grid(bots.bots,['id','role','symbol','status']);document.querySelector('#positions').innerHTML=grid(positions.positions,['symbol','status','entry_price','exit_price','pnl_cents']);document.querySelector('#capital').textContent=`Available: $${(capital.available_trading_capital_cents/100).toFixed(2)}\nRealized profit: $${(capital.realized_net_profit_cents/100).toFixed(2)}`;document.querySelector('#products').innerHTML=grid(products,['title','supplier_name','supplier_sku','cost_cents','sale_cents','status']);document.querySelector('#orders').innerHTML=grid(orders,['external_order_id','quantity','status']);document.querySelector('#emails').innerHTML=grid(emails,['lead_id','subject','status','created_at']);document.querySelector('#tiktok-status').textContent=tiktok.ready?'TikTok Shop connected. Publishing remains approval-gated.':`Awaiting TikTok merchant OAuth: ${tiktok.missing.join(', ')}`;}function form(id,url){document.querySelector(id).onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));for(const key of ['cost_cents','sale_cents'])if(key in data)data[key]=Number(data[key]);try{log(await api(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)}));e.target.reset();refresh()}catch{}}}form('#property-folder','/api/properties/import-folder');form('#bars','/api/trading/import-bars');form('#bot','/api/trading/bots');form('#product','/api/commerce/tiktok/products');form('#email','/api/outreach/drafts');async function renderFilm(id,format){try{log(await api(`/api/properties/${id}/promotional-video`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({format})}))}catch{}}async function evolve(){try{log(await api('/api/trading/evolve-universe',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}));refresh()}catch{}}async function stopSystem(){log(await api('/api/system/emergency-stop',{method:'POST'}));refresh()}async function resumeSystem(){log(await api('/api/system/resume',{method:'POST'}));refresh()}refresh();
</script></body></html>
