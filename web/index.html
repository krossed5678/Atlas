<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRA</title>
<style>body{font-family:system-ui;margin:0;background:#101521;color:#e9edf8}header{padding:26px 7%;background:#172034}main{max-width:1100px;margin:25px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,form{background:#192235;padding:18px;border-radius:12px;margin-bottom:14px}button{background:#52e0b1;border:0;padding:9px 13px;border-radius:8px;font-weight:700;cursor:pointer}input{display:block;margin:8px 0;padding:9px;width:95%;background:#101521;color:#e9edf8;border:1px solid #40506f;border-radius:6px}.danger{background:#fa7785}small{color:#acb9d2}pre{white-space:pre-wrap}</style></head>
<body><header><h1>ASTRA <small>Local Operations Platform</small></h1><p>Property Studio · Commerce & Creators · Trading Lab · System Control</p></header>
<main><div id="status" class="grid"></div><h2>Property Studio</h2>
<form id="folder"><b>Import a local photo folder</b><input name="folder_path" placeholder="C:\\Photos\\Property-01" required><input name="listing_url" placeholder="Optional listing URL metadata"><button>Import photo set</button></form>
<form id="property"><b>Upload a photo set</b><input name="listing_url" placeholder="Optional listing URL metadata"><input name="files" type="file" accept="image/*" multiple required><button>Upload images</button></form>
<h2>Safety</h2><button class="danger" onclick="stop()">Emergency stop</button><pre id="log"></pre></main>
<script>const log=x=>document.querySelector('#log').textContent=JSON.stringify(x,null,2);async function json(r){const x=await r.json();if(!r.ok)throw x;return x}async function refresh(){const x=await fetch('/api/system').then(json);document.querySelector('#status').innerHTML=Object.entries(x.counts).map(([k,v])=>`<div class=card><b>${k}</b><h2>${v}</h2></div>`).join('')+`<div class=card><b>Trading mode</b><h2>${x.settings.trading_mode}</h2><small>External writes: ${x.external_writes_enabled}</small></div>`}document.querySelector('#property').onsubmit=async e=>{e.preventDefault();try{log(await fetch('/api/properties',{method:'POST',body:new FormData(e.target)}).then(json));refresh()}catch(x){log(x)}};document.querySelector('#folder').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{log(await fetch('/api/properties/import-folder',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(f))}).then(json));refresh()}catch(x){log(x)}};async function stop(){log(await fetch('/api/system/emergency-stop',{method:'POST'}).then(json));refresh()}refresh()</script></body></html>
